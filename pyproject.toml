[project]
name = "pfit"
version = "0.1.0"
description = "Aligning protein language models to experimental fitness, with leakage-aware evaluation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.4",
    "transformers>=4.45",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "tqdm>=4.66",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "ipython>=9.18.1",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pfit"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
